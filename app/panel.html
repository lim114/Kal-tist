<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:"><meta name="viewport" content="width=device-width,initial-scale=1"><title>思衡托 · 任务助手</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="codex-font.css"><link rel="stylesheet" href="embedded-layout.css"><link rel="stylesheet" href="glass-controls.css"><link rel="stylesheet" href="appearance-fold.css"><link rel="stylesheet" href="conversation-ui.css"></head><body>
<header><div><small>RHODES ISLAND</small><h1>思衡托 · 任务助手</h1></div><button id="hide" title="收起面板">×</button></header>
<nav><button id="codex">打开 Codex</button><button id="gpt">打开 ChatGPT</button><button id="music" title="网易云音乐播放器">音乐</button><span id="connection">本地连接</span></nav>
<section class="appearance-section"><details id="appearanceSettings"><summary><h2>外观与行为</h2><span id="sizeLabel"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div id="appearanceBody"><div class="resize"><input id="size" aria-label="桌宠大小" type="range" min="120" max="1000" step="1"><input id="sizeNumber" aria-label="大小像素" type="number" min="120" max="1000" step="1"><span>px</span></div>
<div class="row"><label>朝向 <select id="facing"><option value="auto">随鼠标转向</option><option value="left">固定朝左</option><option value="right">固定朝右</option></select></label><label><input id="gaze" type="checkbox"> 眼睛追随鼠标</label></div>
<div class="row"><label><input id="autoStart" type="checkbox"> 随 Codex 启动</label><label>动作 <select id="pose"><option value="auto">自动</option><option value="idle">待机</option><option value="wave">放松示意</option><option value="typing">输入中 · 低头读字</option><option value="thinking">托腮思考</option><option value="waiting">等待 · 单手叉腰</option><option value="error">困惑 · 侧头问号</option></select></label></div><p class="hint">也可 Ctrl + 滚轮缩放；拖动角色移动，双击触摸互动，右键打开任务面板。</p><div class="glass-controls"><div class="glass-heading"><h3>液态玻璃气泡</h3><button id="glassReset" class="quiet" type="button">恢复默认</button></div>
<div class="glass-color-row"><label for="glassColor">颜色</label><input id="glassColor" type="color" value="#365949" aria-label="气泡颜色"><input id="glassHex" type="text" value="#365949" maxlength="7" aria-label="颜色值" spellcheck="false"><div class="glass-swatches" role="group" aria-label="玻璃配色"><button type="button" data-color="#365949" aria-label="灰绿"></button><button type="button" data-color="#cadad5" aria-label="冰透"></button><button type="button" data-color="#5c7394" aria-label="雾蓝"></button><button type="button" data-color="#87719a" aria-label="浅紫"></button></div></div>
<div class="glass-range"><label for="glassTransparency">透明度</label><input id="glassTransparency" type="range" min="0" max="100" step="1" value="60"><input id="glassTransparencyNumber" type="number" min="0" max="100" step="1" value="60" aria-label="透明度百分比"><span>%</span></div>
<div class="row"><label><input id="glassBlur" type="checkbox" checked> 背景模糊</label><span id="glassSupport" class="hint"></span></div><p class="hint">越大越通透；只调整玻璃染色，不淡化文字。100% 时仍保留高光；开启背景模糊时撤去文字衬底，关闭模糊时显示衬底。</p><p id="glassFeedback" role="status" aria-live="polite"></p></div></div></details></section>
<section><div class="section-title"><h2>当前任务</h2><span id="taskCount">读取中</span></div><div id="tasks"></div></section>
<section><div class="section-title"><h2>输入指令</h2><button id="newTask" class="quiet">新任务</button></div><div class="row"><span id="threadMode" class="hint">新建桌宠任务</span><button id="chooseDir" class="quiet">工作目录…</button></div><p id="cwd" class="path"></p>
<textarea id="prompt" rows="3" maxlength="80000" placeholder="让 Codex 帮你做什么？Ctrl + Enter 发送" aria-label="输入指令"></textarea><div class="row actions"><button id="draft" class="quiet">带入 Codex 输入框</button><button id="stop" class="quiet" disabled>停止</button><button id="send" class="primary">发送并运行</button></div>
<div id="embeddedMusic"></div><p id="result" role="status"></p><div id="requests"></div><pre id="reply"></pre></section>
<footer>指令沿用本机 Codex 登录。文件修改和命令执行遵循工作区权限与确认流程。</footer><script type="module" src="panel.js"></script></body></html>
